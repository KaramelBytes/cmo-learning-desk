<!doctype html><html><head><meta charset="utf-8"></head><body>
<div id="status" role="status" style="font:13px system-ui;color:#596579"></div>
<script>
// Streamlit's component protocol; no third-party scripts or requests.
const storageKey = 'cmo_desk_learning_v2';
let lastToken;
function send(type, extra = {}) {
  window.parent.postMessage({isStreamlitMessage:true, type, ...extra}, '*');
}
window.addEventListener('message', event => {
  if (event.source !== window.parent || event.data.type !== 'streamlit:render') return;
  const args = event.data.args;
  if (args.token === lastToken) return;
  lastToken = args.token;
  let result = {token:args.token, ok:true};
  try {
    if (args.operation === 'read') {
      const raw = localStorage.getItem(storageKey);
      result.payload = raw ? JSON.parse(raw) : null;
    } else if (args.operation === 'write') {
      localStorage.setItem(storageKey, JSON.stringify(args.payload));
    } else if (args.operation === 'clear') {
      localStorage.removeItem(storageKey);
      localStorage.removeItem('cmo_desk_resume');
    }
    document.getElementById('status').textContent = args.operation === 'write' ? 'Saved in this browser.' : '';
  } catch (error) {
    result.ok = false;
    document.getElementById('status').textContent = 'Browser saving unavailable. Download a backup in Settings.';
  }
  send('streamlit:setComponentValue', {value:result});
  send('streamlit:setFrameHeight', {height:30});
});
send('streamlit:componentReady', {apiVersion:1});
send('streamlit:setFrameHeight', {height:30});
</script></body></html>
